[project]
name = "genesis-audit-env"
version = "0.2.0"
description = "Synthetic financial-audit RL environment: four error families, a seeded generator and a harness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
genesis-audit = "genesis_audit.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]  # "." for judge_adapter.py and baselines/ at the repo root
testpaths = ["tests"]
addopts = "-q"
markers = ["docker: needs a local Docker daemon and GENESIS_AUDIT_DOCKER_IMAGE"]

[tool.coverage.run]
source = ["genesis_audit"]
branch = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101", "S603", "S607"]  # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
